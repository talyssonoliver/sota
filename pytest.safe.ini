[pytest]
# Safe pytest configuration to prevent hanging/crashing

# Basic configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Conservative display options
console_output_style = progress
log_cli = False
log_cli_level = ERROR
log_level = ERROR

# Safe execution options - prevent hanging
addopts = 
    --tb=short 
    --disable-warnings 
    --maxfail=5
    --timeout=30
    -x
    --no-cov
    --strict-markers

# Environment variables
env =
    ANONYMIZED_TELEMETRY=False
    TESTING=1
    PYTHONDONTWRITEBYTECODE=1

# Path configuration
pythonpath = . src tests

# Conservative markers - avoid parallel execution by default
markers =
    unit: Unit tests
    integration: Integration tests  
    slow: Slow tests
    external: External service tests
    workflow: Workflow tests
    memory: Memory tests
    agent: Agent tests
    sequential: Sequential execution required
    safe: Safe for parallel execution
    
# Disable forked mode (causes issues on Windows)
# Disable automatic parallel execution
# Use minimal workers if parallel execution is explicitly requested
