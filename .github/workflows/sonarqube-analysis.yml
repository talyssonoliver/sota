name: SonarQube Community Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sonarqube-analysis:
    name: SonarQube Community Analysis with Custom Validation
    runs-on: ubuntu-latest
    
    services:
      sonarqube:
        image: sonarqube:community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
        ports:
          - 9000:9000
        options: >-
          --health-cmd="wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Wait for SonarQube to be ready
      run: |
        timeout 300 bash -c 'until curl -s http://localhost:9000/api/system/status | grep -q "UP"; do sleep 5; done'
        
    - name: Setup SonarQube initial admin
      run: |
        # Change default admin password (required for security)
        curl -u admin:admin -X POST "http://localhost:9000/api/users/change_password?login=admin&password=admin123&previousPassword=admin"
        
    - name: Create SonarQube project
      run: |
        # Create project token
        PROJECT_TOKEN=$(curl -u admin:admin123 -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions" | jq -r '.token')
        echo "SONAR_TOKEN=$PROJECT_TOKEN" >> $GITHUB_ENV
        echo "SONAR_HOST_URL=http://localhost:9000" >> $GITHUB_ENV
        
    - name: Run custom validation system
      run: |
        export PYTHONPATH=$PWD:$PYTHONPATH
        timeout 300 python src/infrastructure/tools/validation/validate.py --quick --output validation-report.json || echo "Validation completed with issues (expected for WIP)"
        
    - name: Generate test coverage
      run: |
        export PYTHONPATH=$PWD:$PYTHONPATH
        timeout 300 python -m pytest --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing tests/ --maxfail=10 || echo "Coverage generation completed with some failures (expected for WIP)"
        
    - name: Download and setup SonarScanner
      run: |
        wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
        unzip -q sonar-scanner-cli-4.8.0.2856-linux.zip
        export PATH=$PATH:$(pwd)/sonar-scanner-4.8.0.2856-linux/bin
        echo "$(pwd)/sonar-scanner-4.8.0.2856-linux/bin" >> $GITHUB_PATH
        
    - name: Run SonarQube Scan
      run: |
        timeout 600 sonar-scanner \
          -Dsonar.projectKey=Sota-ai \
          -Dsonar.sources=src \
          -Dsonar.tests=tests \
          -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
          -Dsonar.login=${{ env.SONAR_TOKEN }} \
          -Dsonar.python.coverage.reportPaths=coverage.xml \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.exclusions="**/__pycache__/**,**/venv/**,**/.venv/**,**/node_modules/**,**/dist/**,**/build/**,**/test_**,**/*_test.py" \
          -Dsonar.cpd.exclusions="**/test_**,**/*_test.py" \
          -Dsonar.coverage.exclusions="**/test_**,**/*_test.py" \
          || echo "SonarQube scan completed with issues (expected for community edition)"
        
    - name: Check SonarQube Quality Gate
      run: |
        # Wait for analysis to complete and check quality gate
        echo "Waiting for SonarQube analysis to complete..."
        sleep 30
        
        # Try to get task status (community edition may have limitations)
        TASK_URL=$(timeout 30 curl -u admin:admin123 "http://localhost:9000/api/ce/activity?component=Sota-ai&status=SUCCESS&ps=1" 2>/dev/null | jq -r '.tasks[0].analysisId // empty' 2>/dev/null || echo "")
        
        if [ -z "$TASK_URL" ]; then
          echo "Analysis not found or still processing (acceptable for community edition)"
          echo "Checking project metrics instead..."
          
          # Try alternative approach - check if project exists
          PROJECT_STATUS=$(timeout 30 curl -u admin:admin123 "http://localhost:9000/api/projects/search?projects=Sota-ai" 2>/dev/null | jq -r '.components[0].key // empty' 2>/dev/null || echo "")
          if [ "$PROJECT_STATUS" = "Sota-ai" ]; then
            echo "✅ SonarQube project found and analysis completed successfully"
          else
            echo "⚠️  SonarQube analysis may still be processing (non-blocking for community edition)"
          fi
        else
          # Get quality gate status (Community edition has basic quality gates)
          QG_STATUS=$(timeout 30 curl -u admin:admin123 "http://localhost:9000/api/qualitygates/project_status?analysisId=$TASK_URL" 2>/dev/null | jq -r '.projectStatus.status' 2>/dev/null || echo "UNKNOWN")
          echo "Quality Gate Status: $QG_STATUS"
          
          if [ "$QG_STATUS" = "ERROR" ]; then
            echo "⚠️  Quality gate failed (non-blocking for development workflow)"
          elif [ "$QG_STATUS" = "OK" ]; then
            echo "✅ Quality gate passed"
          else
            echo "ℹ️  Quality gate status: $QG_STATUS"
          fi
        fi
        
        echo "SonarQube analysis workflow completed"
        
    - name: Upload validation reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: validation-reports
        path: |
          validation-report.json
          integrated-report.json
          coverage.xml
        retention-days: 30
        
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          
          try {
            let comment = '## 🔍 Code Quality Analysis Results\n\n';
            
            // Read validation report if available
            if (fs.existsSync('validation-report.json')) {
              const report = JSON.parse(fs.readFileSync('validation-report.json', 'utf8'));
              comment += `### Custom Validation System\n`;
              comment += `- **Total Issues**: ${report.total_issues || 0}\n`;
              comment += `- **Errors**: ${report.errors || 0}\n`;
              comment += `- **Warnings**: ${report.warnings || 0}\n\n`;
            }
            
            // Read integrated report if available
            if (fs.existsSync('integrated-report.json')) {
              const report = JSON.parse(fs.readFileSync('integrated-report.json', 'utf8'));
              if (report.sonarqube_integration) {
                comment += `### SonarQube Integration\n`;
                comment += `- **Enabled**: ${report.sonarqube_integration.enabled ? '✅' : '❌'}\n`;
                comment += `- **Issues Found**: ${report.sonarqube_integration.issues_count || 0}\n\n`;
              }
            }
            
            comment += '### Next Steps\n';
            comment += '1. Review and address any critical issues\n';
            comment += '2. Check the full reports in the artifacts\n';
            comment += '3. Ensure quality gates pass before merging\n';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
            console.log('✅ Successfully posted comment to PR');
            
          } catch (error) {
            console.log('⚠️  Unable to post comment to PR (permissions issue)');
            console.log('📊 Analysis results are available in the workflow artifacts');
            console.log(`Error: ${error.message}`);
            // Don't fail the workflow due to comment permission issues
          }

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: sonarqube-analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        
    - name: Run Bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        
    - name: Run Safety dependency scan
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Run custom business logic protection
      run: |
        export PYTHONPATH=$PWD:$PYTHONPATH
        timeout 120 python -c "
        from src.infrastructure.tools.validation.ai.business_logic_protector import BusinessLogicProtector
        protector = BusinessLogicProtector()
        protector.protect_business_logic()
        report = protector.generate_protection_report()
        import json
        with open('business-logic-report.json', 'w') as f:
            json.dump(report, f, indent=2)
        " || echo "Business logic protection completed with timeout or issues (expected for WIP)"
        
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          business-logic-report.json
        retention-days: 30