# SonarQube Project Configuration for AI System
# ================================================

# Project identification
sonar.projectKey=sota-ai-system
sonar.projectName=SOTA Multi-Agent AI System
sonar.projectVersion=0.1.0
sonar.organization=sota-ai

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.language=py

# Python-specific settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions - align with your existing validation system
sonar.exclusions=\
    **/__pycache__/**,\
    **/venv/**,\
    **/.venv/**,\
    **/node_modules/**,\
    **/dist/**,\
    **/build/**,\
    **/.git/**,\
    **/.pytest_cache/**,\
    **/.mypy_cache/**,\
    **/.ruff_cache/**,\
    **/backup/**,\
    **/test_outputs/**,\
    **/outputs/**,\
    **/*.pyc

# Test exclusions (files that should not be considered for duplication/coverage)
sonar.test.exclusions=\
    **/test_**,\
    **/*_test.py,\
    **/tests/**,\
    **/conftest.py

# Coverage settings
sonar.python.coverage.exclusions=\
    **/tests/**,\
    **/conftest.py,\
    **/__init__.py,\
    **/test_*.py,\
    **/*_test.py

# Quality gate settings that complement your existing validation
sonar.qualitygate.wait=true

# Security settings - align with your BusinessLogicProtector
sonar.security.hotspots.inheritFromParent=true

# Duplication settings - complement your AIPatternDetector
sonar.cpd.python.minimumtokens=50
sonar.cpd.python.minimumlines=5

# Integration with your existing tools
# Note: These can be overridden via CLI or environment variables
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.pylint.reportPaths=pylint-report.json

# Custom properties for integration with your validation system
sonar.projectDescription=Multi-agent AI system with comprehensive validation and business logic protection