# SonarQube Community Project Configuration for AI System
# ======================================================

# Project identification (Community Edition)
sonar.projectKey=Sota-ai
sonar.projectName=SOTA Multi-Agent AI System
sonar.projectVersion=0.1.0
# Note: sonar.organization is not used in Community Edition

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.language=py

# Python-specific settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions - align with your existing validation system
sonar.exclusions=\
    **/__pycache__/**,\
    **/venv/**,\
    **/.venv/**,\
    **/node_modules/**,\
    **/dist/**,\
    **/build/**,\
    **/.git/**,\
    **/.pytest_cache/**,\
    **/.mypy_cache/**,\
    **/.ruff_cache/**,\
    **/backup/**,\
    **/test_outputs/**,\
    **/outputs/**,\
    **/*.pyc

# Test exclusions (files that should not be considered for duplication/coverage)
sonar.test.exclusions=\
    **/test_**,\
    **/*_test.py,\
    **/tests/**,\
    **/conftest.py

# Coverage settings
sonar.python.coverage.exclusions=\
    **/tests/**,\
    **/conftest.py,\
    **/__init__.py,\
    **/test_*.py,\
    **/*_test.py

# Quality gate settings (Community Edition has basic quality gates)
sonar.qualitygate.wait=false

# Basic code duplication detection (available in Community Edition)
sonar.cpd.python.minimumtokens=50
sonar.cpd.python.minimumlines=5

# Integration with external tools (Community Edition compatible)
# Note: These can be overridden via CLI or environment variables
sonar.python.bandit.reportPaths=bandit-report.json

# Custom properties for integration with your validation system
sonar.projectDescription=Multi-agent AI system with comprehensive validation and business logic protection