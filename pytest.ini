[pytest]
# Basic configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display options
console_output_style = classic
log_cli = False
log_cli_level = WARNING
log_level = WARNING

# Performance optimizations
addopts = -n 4 --dist loadscope -p no:warnings -q --tb=short --disable-warnings --durations=20 --maxfail=20 -x --strict-markers

# Environment variables
env =
    ANONYMIZED_TELEMETRY=False
    TESTING=1
    PYTEST_RUNNING=1
    DISABLE_WORKFLOW_MONITORING=1
    PYTHONDONTWRITEBYTECODE=1
    PYTEST_DISABLE_PLUGIN_AUTOLOAD=1

# Path configuration
pythonpath = .

# Test markers for performance optimization
markers =
    unit: Fast unit tests (< 1 second)
    integration: Slower integration tests (1-5 seconds)
    slow: Tests that take > 5 seconds
    external: Tests requiring external services
    workflow: Workflow execution tests
    memory: Memory engine tests
    agent: Agent instantiation tests
    asyncio: Async test marker

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Collection optimizations - ignore heavy directories  
collect_ignore_glob = 
    node_modules/*
    .tox/*
    .venv/*
    venv/*
    build/*
    dist/*
    __pycache__/*
    .git/*
    site-packages/*
    storage/feedback/*
    reports/*
    logs/*

# Timeout configuration
timeout = 500
timeout_method = thread
