[pytest]
# Basic configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display options
console_output_style = progress
log_cli = False
log_cli_level = ERROR
log_level = ERROR

# Memory-optimized performance settings
# Reduced workers from 4 to 1 to prevent memory issues
# Removed parallel execution until memory issues are resolved
addopts = 
    -p no:warnings 
    --tb=short 
    --disable-warnings 
    --durations=10 
    --maxfail=5
    --strict-markers

# Environment variables
env =
    ANONYMIZED_TELEMETRY=False
    TESTING=1
    PYTHONDONTWRITEBYTECODE=1

# Path configuration - Critical for src/ architecture
pythonpath = . src tests

# Test markers for performance optimization
markers =
    unit: Fast unit tests (< 1 second)
    integration: Slower integration tests (1-5 seconds)
    slow: Tests that take > 5 seconds
    external: Tests requiring external services
    workflow: Workflow execution tests
    memory: Memory engine tests  
    agent: Agent instantiation tests
    fixed: Fixed versions of tests
    
# Memory management settings
# Run tests sequentially to avoid memory issues
# Use --dist=no to disable parallel execution for now

# Asyncio configuration
asyncio_default_fixture_loop_scope = function
