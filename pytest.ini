[pytest]
python_paths = src
# Basic configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display options
console_output_style = progress
log_cli = False
log_cli_level = ERROR
log_level = ERROR

# Parallel execution and memory optimization
# Using pytest-xdist for parallel execution with dynamic worker management
# Using pytest-timeout to prevent hanging tests
# Note: pytest-forked is disabled on Windows (not supported)
addopts = 
    -p no:warnings 
    --tb=short 
    --disable-warnings 
    --durations=10 
    --maxfail=30
    --strict-markers

# Parallel execution configuration
# Will be overridden by command line arguments for dynamic workers
# -n auto uses all available CPU cores
# -n logical uses logical CPU count
# --dist loadscope distributes tests by scope for better load balancing
# --tx sets transmission mode for xdist
parallel_args = -n auto --dist loadscope --tx popen//python

# Memory management settings
# Note: Forked mode disabled on Windows, using process isolation instead
memory_args = --benchmark-disable-gc

# Environment variables
env =
    ANONYMIZED_TELEMETRY=False
    TESTING=1
    PYTHONDONTWRITEBYTECODE=1

# Path configuration - Critical for src/ architecture
pythonpath = . src tests

# Test markers for performance optimization and parallel execution
markers =
    unit: Fast unit tests (< 1 second) - run in parallel with high concurrency
    integration: Medium integration tests (1-5 seconds) - run in parallel with medium concurrency  
    slow: Tests that take > 5 seconds - run sequentially or with low concurrency
    external: Tests requiring external services - run sequentially to avoid rate limits
    workflow: Workflow execution tests - run with careful memory management
    memory: Memory engine tests - run with forked processes to isolate memory
    agent: Agent instantiation tests - run with controlled concurrency
    fixed: Fixed versions of tests - run normally
    parallel: Tests safe for parallel execution
    sequential: Tests that must run sequentially
    memory_intensive: Tests with high memory usage - run with limited workers
    io_bound: I/O bound tests - can run with higher concurrency
    cpu_bound: CPU bound tests - limited by CPU cores
    
# Asyncio configuration
asyncio_default_fixture_loop_scope = function
