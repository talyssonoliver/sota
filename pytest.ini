[pytest]
python_paths = src
# Basic configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display options
console_output_style = progress
log_cli = False
log_cli_level = ERROR
log_level = ERROR

# Core performance optimization options (2025 best practices)
# Parallel execution with pytest-xdist using modern configuration
# --dist loadscope: Groups tests by module/class for better load balancing
# --maxfail: Stop after 30 failures to save time
# --tb=short: Concise traceback format
# --durations=10: Show 10 slowest tests for optimization insights
addopts = 
    -n auto
    --dist loadscope
    -p no:warnings 
    --tb=short 
    --disable-warnings 
    --durations=10 
    --maxfail=30
    --strict-markers

# Quick test configuration for fast validation
# Use fewer workers and simpler distribution for speed
quick_addopts = 
    -n 2
    --dist loadfile
    --tb=line
    --maxfail=5
    --disable-warnings
    -x

# Environment variables
env =
    ANONYMIZED_TELEMETRY=False
    TESTING=1
    PYTHONDONTWRITEBYTECODE=1

# Path configuration - Critical for src/ architecture
pythonpath = . src tests

# Test markers for performance optimization and parallel execution (2025 best practices)
markers =
    unit: Fast unit tests (< 1 second) - safe for high concurrency parallel execution
    integration: Medium integration tests (1-5 seconds) - parallel with loadscope distribution  
    slow: Tests that take > 5 seconds - grouped together to prevent blocking
    external: Tests requiring external services - grouped to avoid rate limits
    workflow: Workflow execution tests - use xdist_group for state isolation
    memory: Memory engine tests - grouped for memory isolation
    agent: Agent instantiation tests - grouped for resource management
    fixed: Fixed versions of tests - run normally
    parallel: Tests explicitly safe for parallel execution
    sequential: Tests that must run sequentially - use xdist_group
    memory_intensive: Tests with high memory usage - grouped with limited concurrency
    io_bound: I/O bound tests - can use higher worker counts
    cpu_bound: CPU bound tests - limited by physical CPU cores
    asyncio: Asynchronous tests using asyncio - grouped for event loop isolation
    xdist_group: Custom grouping for pytest-xdist load balancing
    sleep_removed: Tests where time.sleep was removed for performance
    
# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
