# Emergency Test Configuration
# Use this configuration to run tests safely without system crashes

[tool:pytest]
# Strict resource limits to prevent system crashes
timeout = 30
maxfail = 1
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --capture=sys
    --durations=10
    # Resource limits
    --timeout=30
    # Disable problematic features that might cause crashes
    --no-cov
    --disable-warnings
    # Memory constraints
    -v

# Test markers for isolation
markers =
    slow: marks tests as slow (may cause resource issues)
    memory_intensive: marks tests that use significant memory
    real_time: marks tests that involve real-time operations
    dashboard: marks dashboard-related tests
    hitl: marks human-in-the-loop tests
    analytics: marks analytics tests that might have infinite loops

# Resource monitoring
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for individual tests
timeout_method = thread
