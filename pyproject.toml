[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=json:coverage.json --cov-report=term --cov-fail-under=0"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[project]
name = "ai-system"
requires-python = ">=3.10,<3.14"
description = "Production-ready multi-agent AI system for automating software development workflows"
authors = [
    {name = "AI System Team"}
]
license = {text = "MIT"}
dynamic = ["version"]

[project.optional-dependencies]
enterprise = [
    "azure-keyvault-secrets>=4.7.0",
    "azure-identity>=1.15.0",
    "boto3>=1.34.0",
    "hvac>=2.1.0"
]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=0.25.2",
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.13.0",
    "ruff>=0.4.0",
    "jupyterlab>=4.4.1"
]
