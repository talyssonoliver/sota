[pytest]
# Ultra-safe pytest configuration to prevent hanging

# Basic configuration  
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ultra-conservative execution to prevent hanging
addopts = 
    --tb=line
    --disable-warnings
    --maxfail=10
    --no-cov
    --strict-markers
    --no-header
    --quiet
    --durations=0

# Prevent hanging issues
# timeout = 10
# timeout_method = thread

# Environment
env =
    TESTING=1
    PYTHONDONTWRITEBYTECODE=1
    PYTEST_TIMEOUT=10
    PYTEST_DISABLE_PLUGIN_AUTOLOAD=1

# Path configuration
pythonpath = . src

# Minimal markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that should be skipped

# Filter warnings that might cause hanging
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning

# Disable all plugins that might cause issues
addini_value_line = addopts
